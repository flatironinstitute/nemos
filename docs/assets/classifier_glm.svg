<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 250" width="540" height="300" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#231f20"/>
    </marker>
  </defs>

  <text x="225" y="20" font-size="16" font-weight="bold" text-anchor="middle" fill="#231f20">ClassifierGLM</text>

  <!-- X -->
  <text x="60" y="44" font-size="10" text-anchor="middle" fill="#666666">n_features</text>
  <text x="22" y="125" font-size="10" text-anchor="middle" fill="#666666" transform="rotate(-90 22 125)">n_samples</text>
  <rect x="30" y="50" width="60" height="150" fill="#ececec" stroke="#231f20" stroke-width="1.5"/>
  <text x="60" y="222" font-size="15" font-style="italic" text-anchor="middle" fill="#231f20">X</text>

  <text x="105" y="84" font-size="20" text-anchor="middle" fill="#231f20">·</text>

  <!-- W: one column per class -->
  <text x="144" y="44" font-size="10" text-anchor="middle" fill="#666666">n_classes</text>
  <rect x="120" y="50" width="16" height="60" fill="#FAE0C8" stroke="#E07B39" stroke-width="1.5"/>
  <rect x="136" y="50" width="16" height="60" fill="#DDEFDA" stroke="#4F9E4F" stroke-width="1.5"/>
  <rect x="152" y="50" width="16" height="60" fill="#DCE6F3" stroke="#4C82C3" stroke-width="1.5"/>
  <text x="144" y="128" font-size="15" font-style="italic" text-anchor="middle" fill="#231f20">W</text>

  <text x="211" y="113" font-size="11" text-anchor="middle" fill="#666666">softmax( · + c)</text>
  <line x1="178" y1="125" x2="244" y2="125" stroke="#231f20" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- class probabilities -->
  <text x="278" y="44" font-size="10" text-anchor="middle" fill="#666666">n_classes</text>
  <rect x="254" y="50" width="16" height="150" fill="#FAE0C8" stroke="#E07B39" stroke-width="1.5"/>
  <rect x="270" y="50" width="16" height="150" fill="#DDEFDA" stroke="#4F9E4F" stroke-width="1.5"/>
  <rect x="286" y="50" width="16" height="150" fill="#DCE6F3" stroke="#4C82C3" stroke-width="1.5"/>
  <text x="278" y="222" font-size="15" font-style="italic" text-anchor="middle" fill="#231f20">P</text>
  <text x="278" y="238" font-size="10" text-anchor="middle" fill="#666666">(n_samples, n_classes)</text>

  <text x="339" y="113" font-size="11" text-anchor="middle" fill="#666666">argmax</text>
  <line x1="312" y1="125" x2="378" y2="125" stroke="#231f20" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- labels, colored by class -->
  <text x="398" y="44" font-size="10" text-anchor="middle" fill="#666666">label</text>
  <rect x="390" y="50" width="16" height="15" fill="#FAE0C8" stroke="#E07B39" stroke-width="1"/>
  <text x="398" y="61" font-size="10" text-anchor="middle" fill="#232038">0</text>
  <rect x="390" y="65" width="16" height="15" fill="#DCE6F3" stroke="#4C82C3" stroke-width="1"/>
  <text x="398" y="76" font-size="10" text-anchor="middle" fill="#232038">2</text>
  <rect x="390" y="80" width="16" height="15" fill="#DCE6F3" stroke="#4C82C3" stroke-width="1"/>
  <text x="398" y="91" font-size="10" text-anchor="middle" fill="#232038">2</text>
  <rect x="390" y="95" width="16" height="15" fill="#DDEFDA" stroke="#4F9E4F" stroke-width="1"/>
  <text x="398" y="106" font-size="10" text-anchor="middle" fill="#232038">1</text>
  <rect x="390" y="110" width="16" height="15" fill="#FAE0C8" stroke="#E07B39" stroke-width="1"/>
  <text x="398" y="121" font-size="10" text-anchor="middle" fill="#232038">0</text>
  <rect x="390" y="125" width="16" height="15" fill="#DDEFDA" stroke="#4F9E4F" stroke-width="1"/>
  <text x="398" y="136" font-size="10" text-anchor="middle" fill="#232038">1</text>
  <rect x="390" y="140" width="16" height="15" fill="#DCE6F3" stroke="#4C82C3" stroke-width="1"/>
  <text x="398" y="151" font-size="10" text-anchor="middle" fill="#232038">2</text>
  <rect x="390" y="155" width="16" height="15" fill="#FAE0C8" stroke="#E07B39" stroke-width="1"/>
  <text x="398" y="166" font-size="10" text-anchor="middle" fill="#232038">0</text>
  <rect x="390" y="170" width="16" height="15" fill="#FAE0C8" stroke="#E07B39" stroke-width="1"/>
  <text x="398" y="181" font-size="10" text-anchor="middle" fill="#232038">0</text>
  <rect x="390" y="185" width="16" height="15" fill="#DDEFDA" stroke="#4F9E4F" stroke-width="1"/>
  <text x="398" y="196" font-size="10" text-anchor="middle" fill="#232038">1</text>
  <text x="398" y="222" font-size="15" font-style="italic" text-anchor="middle" fill="#231f20">y</text>
  <text x="398" y="238" font-size="10" text-anchor="middle" fill="#666666">(n_samples,)</text>
</svg>
