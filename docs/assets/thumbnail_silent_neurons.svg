<svg xmlns="http://www.w3.org/2000/svg" width="300" height="180" viewBox="0 0 300 180" font-family="monospace">
  <style>
    .ink { fill: #000000; }
    .axis { stroke: #000000; }
    .silent { fill: #E07B39; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #ffffff; }
      .axis { stroke: #ffffff; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/>
    </marker>
  </defs>
  <text class="ink" x="160" y="20" font-size="15" font-family="sans-serif" text-anchor="middle">Handling silent neurons</text>
  <line class="axis" x1="40" y1="162" x2="40" y2="34" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line class="axis" x1="40" y1="162" x2="235" y2="162" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="ink" x="22" y="98" font-size="12" font-family="sans-serif" text-anchor="middle" transform="rotate(-90 22 98)">units</text>
  <text class="ink" x="137" y="177" font-size="12" font-family="sans-serif" text-anchor="middle">time</text>
  <g font-size="11" font-family="sans-serif">
    <rect class="ink" x="243" y="84" width="8" height="8"/>
    <text class="ink" x="255" y="92">active</text>
    <rect class="silent" x="243" y="103" width="8" height="8"/>
    <text class="ink" x="255" y="111">silent</text>
  </g>
  <g font-size="14" letter-spacing="2.6">
    <text class="ink" x="50" y="53">0100100010000001</text>
    <text class="silent" x="50" y="72">0000000000000000</text>
    <text class="ink" x="50" y="91">1000010001001000</text>
    <text class="ink" x="50" y="110">0010000100000110</text>
    <text class="silent" x="50" y="129">0000000000000000</text>
    <text class="ink" x="50" y="148">0001001000100010</text>
  </g>
</svg>
