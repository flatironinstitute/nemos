<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 112" width="260" height="112" role="img" aria-label="Stimulus screen seen in perspective, with a grating patch on the right side">
  <title>Stimulus screen with grating on the right</title>
  <defs>
    <!-- Grating patch (from pieces/grating.svg): near-square-wave carrier under a soft-edged envelope. -->
    <linearGradient id="carrier" x1="0" y1="1" x2="1" y2="0.15">
      <stop offset="0.00" stop-color="#ffffff"/>
      <stop offset="0.10" stop-color="#ffffff"/>
      <stop offset="0.13" stop-color="#000000"/>
      <stop offset="0.22" stop-color="#000000"/>
      <stop offset="0.25" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#ffffff"/>
      <stop offset="0.38" stop-color="#000000"/>
      <stop offset="0.47" stop-color="#000000"/>
      <stop offset="0.50" stop-color="#ffffff"/>
      <stop offset="0.60" stop-color="#ffffff"/>
      <stop offset="0.63" stop-color="#000000"/>
      <stop offset="0.72" stop-color="#000000"/>
      <stop offset="0.75" stop-color="#ffffff"/>
      <stop offset="0.85" stop-color="#ffffff"/>
      <stop offset="0.88" stop-color="#000000"/>
      <stop offset="0.97" stop-color="#000000"/>
      <stop offset="1.00" stop-color="#ffffff"/>
    </linearGradient>
    <radialGradient id="envelope" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.00" stop-color="#ffffff"/>
      <stop offset="0.72" stop-color="#ffffff"/>
      <stop offset="0.90" stop-color="#c8c8c8"/>
      <stop offset="1.00" stop-color="#000000"/>
    </radialGradient>
    <mask id="gabor_mask">
      <rect x="0" y="0" width="100" height="100" fill="url(#envelope)"/>
    </mask>
    <!-- Keep the patch inside the screen even if it is moved towards an edge. -->
    <clipPath id="screen_clip">
      <path d="M8 8 H252 L219 103 H45 Z"/>
    </clipPath>
  </defs>

  <!-- Screen: rectangular monitor seen from below, so it reads as a trapezoid. -->
  <path d="M8 8 H252 L219 103 H45 Z" fill="#b3b3b3" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Grating on the right half of the screen; rotated so the bars run "///". -->
  <g clip-path="url(#screen_clip)">
    <g transform="translate(190 42) rotate(90) scale(0.3) translate(-50 -50)">
      <rect x="0" y="0" width="100" height="100" fill="url(#carrier)" mask="url(#gabor_mask)"/>
    </g>
  </g>
</svg>
