name: check-pr-template

permissions: {}

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

jobs:
  check-pr-template:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Contributors with write access (maintainers) are exempt from the check.
      - name: Check whether the PR author has write access
        id: author
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if permission=$(gh api "repos/$REPO/collaborators/$AUTHOR/permission" --jq .permission); then
            echo "Permission of $AUTHOR: $permission"
          else
            echo "::warning::Could not look up the permission of $AUTHOR; enforcing the template."
            permission=none
          fi
          if [ "$permission" = admin ] || [ "$permission" = write ]; then
            echo "enforce=false" >> "$GITHUB_OUTPUT"
          else
            echo "enforce=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check PR description follows the template
        if: steps.author.outputs.enforce == 'true'
        # The body is passed through an env var (never interpolated into the script)
        # to avoid template injection.
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        shell: python
        run: |
          import os
          import re
          import sys

          body = (os.environ.get("PR_BODY") or "").replace("\r\n", "\n")
          # Ignore the template's HTML comments.
          body = re.sub(r"<!--.*?-->", "", body, flags=re.S)

          # Map each "##"/"###" heading to the text below it.
          headings = list(re.finditer(r"^#{2,3}\s+(.+?)\s*$", body, flags=re.M))
          sections = {}
          for i, match in enumerate(headings):
              end = headings[i + 1].start() if i + 1 < len(headings) else len(body)
              sections[match.group(1)] = body[match.end():end].strip()

          checked_box = r"^\s*[-*]\s*\[[xX]\]"
          errors = []

          required = [
              "1. Contributor statement",
              "AI Assistance Disclosure",
              "Motivation",
              "PR description",
              "Checklist",
          ]
          for heading in required:
              if heading not in sections:
                  errors.append(f"Missing section '{heading}'.")

          if "AI Assistance Disclosure" in sections:
              n_checked = len(
                  re.findall(checked_box, sections["AI Assistance Disclosure"], flags=re.M)
              )
              if n_checked != 1:
                  errors.append(
                      "Select exactly one option under 'AI Assistance Disclosure' "
                      f"({n_checked} selected)."
                  )

          for heading in ("Motivation", "PR description"):
              if heading in sections:
                  # Drop the italic "*Please ...*" placeholder before checking for content.
                  text = re.sub(r"^\*Please .*?\*$", "", sections[heading], flags=re.M)
                  if not text.strip():
                      errors.append(f"Fill out the '{heading}' section.")

          if "Checklist" in sections and not re.search(
              checked_box + r"\s*I have described the changes",
              sections["Checklist"],
              flags=re.M,
          ):
              errors.append(
                  "Tick 'I have described the changes in this PR' in the 'Checklist' section."
              )

          if errors:
              summary = "\n".join(f"- {e}" for e in errors)
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
                  f.write(
                      "## PR description does not follow the template\n\n"
                      "See `.github/pull_request_template.md`.\n\n"
                      f"{summary}\n"
                  )
              for e in errors:
                  print(f"::error::{e}")
              sys.exit(1)

          print("PR description follows the template.")
