[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "nemos"
dynamic = ["version"]
authors = [{name = "nemos authors"}]
description = "NEural MOdelS, a statistical modeling framework for neuroscience."
readme = "README.md"
requires-python = ">=3.12,<3.15"
keywords = ["neuroscience", "Poisson-GLM"]
license = { file = "LICENSE" }
classifiers = [
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14"
]

# Define dependencies for the project
dependencies = [
    "jax>=0.4.28",                  # Numerical computing library
    "numpy>1.20",                   # Numerical computing library
    "scipy>=1.10",                  # Scientific computing library
    "typing_extensions>=4.6",       # Typing extensions for Python
    'pynapple>=0.10.1',             # On this version, changed tuning curve API
    "scikit-learn",                 # BaseEstimator and Tags inheritance
    "optimistix>=0.0.11",
    "optax>=0.2.5",
    "lazy_loader>=0.4",             # Lazy loading for improved import times
]


# Configure package discovery for setuptools
[tool.setuptools.packages.find]
where = ["src"]     # The directory where package modules are located
include = ["nemos"] # The specific package(s) to include in the distribution

[tool.setuptools_scm]
version_scheme = 'python-simplified-semver'
local_scheme = 'no-local-version'

# Define optional dependencies for the project
[project.optional-dependencies]
dev = [
    "pip-tools",                    # Dependency management
    "ruff",                         # General formatting
    "pytest",                       # Testing framework
    "pytest-xdist",                 # Parallelize pytest
    "coverage",                     # Test coverage measurement
    "pytest-cov",                   # Test coverage plugin for pytest
    "statsmodels",                  # Used to compare model pseudo-r2 in testing
    "scikit-learn",                 # Testing compatibility with CV & pipelines
    "matplotlib>=3.7",              # Needed by doctest to run docstrings examples
    "pooch",                        # Required by doctest for fetch module
    "seaborn",                      # Required by doctest for _documentation_utils module
    "myst-nb",                      # Test myst_nb utils for glue
    "hmmlearn",                     # Test algorithmic implementations of HMM
    "tox-uv",                       # Run tox with uv for faster installs
    "zarr",                         # For testing lazy array loading from zarr files
    "h5py",                         # For testing lazy array loading from HDF5 files
    "fsspec",
    "tqdm",
    "pyyaml",                       # Parses notebook front matter in scripts/check_notebook_metadata.py
]
docs = [
    "pynapple>=0.11",               # Required for nap.compute_event_triggered_average(...) in a tutorial
    "numpydoc",
    "sphinx",
    "pydata-sphinx-theme",
    "sphinx-autodoc-typehints",
    "sphinx-copybutton",
    "sphinx-design",
    "sphinx-issues",
    "sphinxcontrib-apidoc",
    "sphinxcontrib-bibtex",
    "sphinx-togglebutton",
    "sphinx_code_tabs",
    "sphinxemoji",
    "myst-parser",
    "myst-nb",
    "dandi",
    "sphinx-autobuild",
    "sphinx-contributors",
    "scikit-learn",
    "dandi",
    "matplotlib>=3.7",
    "seaborn",
    "pooch",
    "ipywidgets",
    "ipykernel",
    "patsy",
    "tqdm",
    "formulaic",                    # Design matrix constuction package, used in a doc note
    "one-api"
]
examples = [
    "scikit-learn",
    "dandi",
    "matplotlib>=3.7",
    "seaborn",
    "pooch",
    "fsspec",
    "patsy",
    "tqdm",
]
jaxopt = [
    "jaxopt>=0.6",
]



# Configure pytest
[tool.pytest.ini_options]
testpaths = ["tests"]             # Specify the directory where test files are located
filterwarnings = [
    # note the use of single quote below to denote "raw" strings in TOML
    # this is raised whenever one imports the plotting utils
    'ignore:plotting functions contained within:UserWarning',
    # numerical inversion test reaches tolerance...
    'ignore:Tolerance of -?\d\.\d+e-\d\d reached:RuntimeWarning',
    # mpl must be non-interctive for testing otherwise doctests will freeze
    'ignore:FigureCanvasAgg is non-interactive, and thus cannot be shown:UserWarning',
    # expected whenever a test pins every parameter; `pytest.warns` still sees it
    'ignore:Every parameter is fixed:UserWarning',
]
markers = [
  "solver_related: tests that interact with solvers",
  "requires_x64: mark test as requiring JAX float64 precision",
  # Coverage guards: compare what the package registers/discovers against what the test
  # parametrizations cover, so an uncovered component fails instead of passing silently.
  # No fitting, so the whole set runs in about a second -- run it BEFORE writing tests
  # (`pytest -m metatest -q`). Never exclude it from a run.
  "metatest: coverage guard asserting the test suite covers every registered component",
]
# -s: no capture from pytest (prints will show)
addopts = ["-s", "--strict-markers"]

[tool.coverage.run]
omit = [
    "src/nemos/fetch/*",
    "src/nemos/_documentation_utils/*",
]

[tool.coverage.report]
exclude_lines = [
    "@abc.abstractmethod",
    "if __name__ == .__main__.:"
]

[tool.ruff]
extend-include = ["*.ipynb"]
src = ["src", "tests", "examples"]
exclude = ["src/nemos/_documentation_utils"]

# Set the maximum line length (same as Black)
line-length = 88

indent-width = 4 # same as Black

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

docstring-code-format = true

[tool.ruff.lint]
preview = true
select = [
    # pycodestyle
    "E",
    # Pyflakes: basic static analysis for common errors like undefined names
    # and missing imports.
    "F",
    # isort
    "I",
    # in particular, this looks for invalid escape sequences (has been an issue
    # for regex strings used in tests)
    "W",
    # docstrings, note that DOC rules (pydoclint) are all in preview, so have to be explicitly added
    "D",
    # catch missing f-strings (this is in preview and so has to be explicitly added)
    "RUF027",
    # complexity check
    "C90"
]
ignore = ["D420", "D421", "D401", "F722"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pycodestyle]
max-line-length = 120

[tool.ruff.lint.per-file-ignores]
# Ignore documentation and annotation rules outside src.
"!src/**.py" = ["D", "DOC", "ANN"]

# Tests and scripts have explicit setup and may use older syntax to test compatibility.
"tests/**" = [
    "E501",  # Long parametrizations and expected messages.
    "C901",  # Complex tests and fixtures.
    "E731",  # Lambda assignments as compact test callables.
    "E741",  # Short mathematical variable names.
]
"scripts/**" = [
    "E501",  # Long parametrizations and expected messages.
    "C901",  # Complex scripts.
    "E731",  # Lambda assignments as compact test callables.
    "E741",  # Short mathematical variable names.
]


[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.jupytext]
# Keep the writer's local jupytext version out of the myst-nb markdown notebooks,
# so saving one from Jupyter Lab does not stamp it into the front matter and add
# an unrelated change to the diff.
#
# The kernel display name is the other field Jupyter Lab rewrites, but it cannot
# be filtered the same way: `kernelspec.display_name` is a required property of
# the nbformat schema, so a notebook without it fails validation and jupytext can
# no longer read the file. scripts/check_notebook_metadata.py enforces that one
# instead.
notebook_metadata_filter = "-jupytext.text_representation.jupytext_version"
